<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הדרכה: שליחת גיליון</title>
<style>
:root{--bg:#FAF8F5;--ink:#1c2430;--mut:#667085;--acc:#2563eb;--ok:#059669}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"IBM Plex Sans Hebrew",Assistant,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:min(1100px,100%);background:#fff;border:1px solid #0001;border-radius:20px;box-shadow:0 1px 2px #0001,0 12px 40px #0000000f;overflow:hidden}
.head{display:flex;align-items:center;gap:16px;padding:20px 28px}
.num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
h1{margin:0;font-size:clamp(22px,3.4vw,38px);line-height:1.2}p{margin:4px 0 0;color:var(--mut);font-size:clamp(14px,1.6vw,18px)}
.stage{position:relative;aspect-ratio:8/5;background:#eef0f4;border-block:1px solid #0001}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s ease-out}
.stage img.on{opacity:1}
.note{position:absolute;inset-inline-start:12px;bottom:12px;background:#0009;color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
.foot{display:flex;align-items:center;gap:16px;padding:16px 28px}
button{min-width:44px;height:44px;border-radius:12px;border:1px solid #0002;background:#fff;font:inherit;cursor:pointer;padding:0 16px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{flex:1;height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;cursor:pointer;direction:rtl}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.t{font-variant-numeric:tabular-nums;color:var(--mut);direction:ltr;min-width:84px;text-align:center}
.steps{display:flex;gap:6px;padding:0 28px 20px}.steps b{flex:1;height:4px;border-radius:4px;background:#e5e7eb}.steps b.on{background:var(--ok)}
</style>
