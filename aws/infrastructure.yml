AWSTemplateFormatVersion: '2010-09-09'
Description: חתם סופר - תשתית ECS Fargate (ECR, סודות, הרשאת OIDC ל-GitHub, ALB עם WAF, Route 53)

# פריסה: CloudFormation -> Create stack -> העלאת הקובץ הזה. אזור: eu-central-1.
# ⚠️ משימה אחת בלבד (DesiredCount=1): instrumentation.ts מריץ תזמונים פנימיים (גיבוי, פריקה, סנכרונים),
# ושתי משימות היו מריצות אותם פעמיים. כמו ב-Railway.

Parameters:
  ProjectName: {Type: String, Default: chasamsofer, AllowedPattern: "^[a-z][a-z0-9-]{1,30}$", Description: "שם הפרויקט באותיות קטנטנות באנגלית. משמש לשמות כל המשאבים ולתגית Project. לפרויקט נוסף: שם סטאק ושם פרויקט אחרים"}
  GitHubRepo: {Type: String, Default: shlomo1315/chatamsofer, Description: "owner/repo של הפרויקט. ההרשאה לפריסה מוגבלת לענף main שלו בלבד"}
  DomainName: {Type: String, Default: aws.chasamsofer.co.il, Description: "הכתובת שהאתר עונה בה. תת-דומיין זמני (aws.chasamsofer.co.il) או הדומיין הסופי"}
  CreateDnsZone: {Type: String, Default: 'false', AllowedValues: ['true', 'false'], Description: "false = מצב ביניים: ה-DNS נשאר אצל הרשם, בלי אזור Route 53. true = מעבר סופי: נוצר אזור והרשומות בו (ומחליפים שרתי שמות)"}
  CertificateArn: {Type: String, Default: '', AllowedPattern: "^(arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/[a-f0-9-]+)?$", Description: "ARN של תעודת ACM שהונפקה לדומיין. ריק = מצב זמני על HTTP עד שהתעודה מאומתת, ואז מריצים שוב עם ARN"}
  CertValidationName: {Type: String, Default: '', Description: "שם רשומת ה-CNAME של אימות התעודה, כדי שהחידוש האוטומטי ימשיך לעבוד גם אחרי החלפת שרתי השמות"}
  CertValidationValue: {Type: String, Default: '', Description: "ערך רשומת האימות"}
  VpcId: {Type: AWS::EC2::VPC::Id, Description: "ה-VPC ברירת המחדל"}
  SubnetIds: {Type: "List<AWS::EC2::Subnet::Id>", Description: "שתי תתי-רשתות ציבוריות בשני אזורי זמינות (המאזן והשרת)"}
  TaskCpu: {Type: String, Default: '512', AllowedValues: ['512', '1024', '2048'], Description: "מעבד לשרת: 512 = חצי ליבה, 1024 = ליבה. משפיע ישירות על העלות"}
  TaskMemory: {Type: String, Default: '1024', AllowedValues: ['1024', '2048', '3072', '4096'], Description: "זיכרון ב-MB. 512 מעבד מאפשר עד 4096, 1024 מאפשר 2048 ומעלה"}
  DbInstanceClass: {Type: String, Default: db.t4g.medium, Description: "גודל מופע המסד"}
  DbStorageGb: {Type: Number, Default: 50, MinValue: 20, Description: "אחסון התחלתי ב-GB (גדל אוטומטית עד 200)"}
  SupaDesiredCount: {Type: Number, Default: 0, Description: "0 עד שהמסד החדש מולא ונוצר הסוד supabase-gw. אז 1"}
  DesiredCount: {Type: Number, Default: 0, Description: "0 בהקמה ראשונה. אחרי שהפריסה הראשונה העלתה image: 1"}
  CreateOidcProvider: {Type: String, Default: 'true', AllowedValues: ['true', 'false'], Description: "false אם כבר קיים provider של GitHub בחשבון"}
  ExistingOidcProviderArn: {Type: String, Default: ''}

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, '']]
  HasCertValidation: !Not [!Equals [!Ref CertValidationName, '']]
  MakeZone: !Equals [!Ref CreateDnsZone, 'true']
  MakeCertRecord: !And [!Condition MakeZone, !Condition HasCertValidation]
  MakeOidc: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"untagged-after-1-day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"keep-last-10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  # ⚠️ הערכים ריקים בכוונה: ממלאים אותם ב-Secrets Manager (Retrieve/Edit) ולא כאן. אל תשנו את SecretString בתבנית אחרי המילוי.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/prod"
      SecretString: '{"ANTHROPIC_API_KEY":"","BOOK_FAIR_AUTO_OPEN_DISABLED":"","BOOK_FAIR_CLEANUP_DISABLED":"","CRON_SECRET":"","DAILY_BACKUP_DISABLED":"","DISTRIBUTIONS_PORTAL_SECRET":"","ELEVENLABS_API_KEY":"","ELEVENLABS_MODEL_ID":"","ELEVENLABS_VOICE_ID":"","GILYONOT_DISABLED":"","GILYONOT_FROM_EMAIL":"","GILYONOT_NEDARIM_TOKEN":"","GMAIL_CLIENT_ID":"","GMAIL_CLIENT_SECRET":"","GMAIL_EMAIL":"","GMAIL_PUBSUB_TOPIC":"","GMAIL_PUSH_TOKEN":"","GMAIL_REDIRECT_URI":"","GMAIL_WATCH_RENEW_DISABLED":"","GOOGLE_DRIVE_BACKUP_FOLDER_ID":"","GOOGLE_SA_KEY":"","GOV_SYNC_DISABLED":"","KVITEL_MAILBOX":"","KVITEL_NEDARIM_TOKEN":"","LEGACY_SYNC_DISABLED":"","LIVE_BALANCES_DISABLED":"","LIVE_BALANCES_ENABLED":"","LOANS_PORTAL_SECRET":"","LOANS_REPORT_DISABLED":"","MAIL_DOMAIN":"","MATERNITY_CARD_RETRY_DISABLED":"","NEDARIM_API_PASSWORD":"","NEDARIM_CREATE_TXN_URL":"","NEDARIM_GUARD_ALERT_TO":"","NEDARIM_HISTORY_URL":"","NEDARIM_HOLIDAY_LIMITED_ID":"","NEDARIM_MATERNITY_LIMITED_ID":"","NEDARIM_MOSAD_ID":"","NEDARIM_PROXY_URL":"","NEWSLETTER_DISABLED":"","NEXTAUTH_SECRET":"","OTP_NONCE_SECRET":"","RABBI_FORM_BLANK_URL":"","RESEND_API_KEY":"","RESEND_WEBHOOK_SECRET":"","RESEND_WEBHOOK_SIGNING_SECRET":"","SCHEDULED_MAIL_DISABLED":"","SUPABASE_SERVICE_ROLE_KEY":"","UNLOAD_EXPIRED_DISABLED":"","VERIFY_FROM_EMAIL":"","VERIFY_FROM_NAME":"","VOICE_REBUILD_DISABLED":"","YEMOT_ANNOUNCE_TEMPLATE_ID":"","YEMOT_API_TOKEN":"","YEMOT_BOOK_FAIR_AUDIO":"","YEMOT_BOOK_FAIR_CALLER_ID":"","YEMOT_BOOK_FAIR_CREDIT_TEMPLATE_ID":"","YEMOT_BOOK_FAIR_EXT":"","YEMOT_BOOK_FAIR_TEXT_ONLY":"","YEMOT_BOOK_FAIR_TOKEN":"","YEMOT_CREDITS_FALLBACK_FOLDER":"","YEMOT_CREDITS_SECRET":"","YEMOT_FOLDER_HOLIDAY":"","YEMOT_FOLDER_IVR_FILES":"","YEMOT_FOLDER_MATERNITY":"","YEMOT_GILYONOT_SECRET":"","YEMOT_HOLIDAY_EXT":"","YEMOT_KVITEL_SECRET":"","YEMOT_MATERNITY_EXT":"","YEMOT_MENU_EXT":"","YEMOT_OTP_CALLER_ID":"","YEMOT_OTP_DIGIT_SEP":"","YEMOT_OTP_TEMPLATE_ID":"","YEMOT_SINGLE_ENDPOINT":"","YEMOT_TOKEN":"","YEMOT_WEBHOOK_SECRET":""}'

  # פרטי החיבור לקריאה בלבד מ-Supabase (host/user/password). ממלאים עם aws/fill-src-secret.sh בלי הדפסה
  SrcSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/supabase-src"
      SecretString: '{"host":"","user":"","password":""}'
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${ProjectName}", RetentionInDays: 30}

  Cluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterName: !Ref ProjectName}

  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: [!Ref AppSecret, !Ref SrcSecret, !Ref SupaSecret, !GetAtt Db.MasterUserSecret.SecretArn]}]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: files-bucket
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject'], Resource: !Sub "${FilesBucket.Arn}/*"}
              - {Effect: Allow, Action: 's3:ListBucket', Resource: !GetAtt FilesBucket.Arn}

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          # image זמני עד הפריסה הראשונה מ-GitHub
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:latest"
          Essential: true
          PortMappings: [{ContainerPort: 3000}]
          Environment:
            - {Name: NEXT_PUBLIC_SITE_URL, Value: !Sub "https://${DomainName}"}
            - {Name: NEXT_PUBLIC_APP_URL, Value: !Sub "https://${DomainName}"}
            - {Name: TZ, Value: Asia/Jerusalem}
            - {Name: NEXT_PUBLIC_SUPABASE_URL, Value: !Sub "https://${DomainName}"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Sub "/ecs/${ProjectName}", awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: app}
          Secrets:
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub "${AppSecret}:ANTHROPIC_API_KEY::"
            - Name: BOOK_FAIR_AUTO_OPEN_DISABLED
              ValueFrom: !Sub "${AppSecret}:BOOK_FAIR_AUTO_OPEN_DISABLED::"
            - Name: BOOK_FAIR_CLEANUP_DISABLED
              ValueFrom: !Sub "${AppSecret}:BOOK_FAIR_CLEANUP_DISABLED::"
            - Name: CRON_SECRET
              ValueFrom: !Sub "${AppSecret}:CRON_SECRET::"
            - Name: DAILY_BACKUP_DISABLED
              ValueFrom: !Sub "${AppSecret}:DAILY_BACKUP_DISABLED::"
            - Name: DISTRIBUTIONS_PORTAL_SECRET
              ValueFrom: !Sub "${AppSecret}:DISTRIBUTIONS_PORTAL_SECRET::"
            - Name: ELEVENLABS_API_KEY
              ValueFrom: !Sub "${AppSecret}:ELEVENLABS_API_KEY::"
            - Name: ELEVENLABS_MODEL_ID
              ValueFrom: !Sub "${AppSecret}:ELEVENLABS_MODEL_ID::"
            - Name: ELEVENLABS_VOICE_ID
              ValueFrom: !Sub "${AppSecret}:ELEVENLABS_VOICE_ID::"
            - Name: GILYONOT_DISABLED
              ValueFrom: !Sub "${AppSecret}:GILYONOT_DISABLED::"
            - Name: GILYONOT_FROM_EMAIL
              ValueFrom: !Sub "${AppSecret}:GILYONOT_FROM_EMAIL::"
            - Name: GILYONOT_NEDARIM_TOKEN
              ValueFrom: !Sub "${AppSecret}:GILYONOT_NEDARIM_TOKEN::"
            - Name: GMAIL_CLIENT_ID
              ValueFrom: !Sub "${AppSecret}:GMAIL_CLIENT_ID::"
            - Name: GMAIL_CLIENT_SECRET
              ValueFrom: !Sub "${AppSecret}:GMAIL_CLIENT_SECRET::"
            - Name: GMAIL_EMAIL
              ValueFrom: !Sub "${AppSecret}:GMAIL_EMAIL::"
            - Name: GMAIL_PUBSUB_TOPIC
              ValueFrom: !Sub "${AppSecret}:GMAIL_PUBSUB_TOPIC::"
            - Name: GMAIL_PUSH_TOKEN
              ValueFrom: !Sub "${AppSecret}:GMAIL_PUSH_TOKEN::"
            - Name: GMAIL_REDIRECT_URI
              ValueFrom: !Sub "${AppSecret}:GMAIL_REDIRECT_URI::"
            - Name: GMAIL_WATCH_RENEW_DISABLED
              ValueFrom: !Sub "${AppSecret}:GMAIL_WATCH_RENEW_DISABLED::"
            - Name: GOOGLE_DRIVE_BACKUP_FOLDER_ID
              ValueFrom: !Sub "${AppSecret}:GOOGLE_DRIVE_BACKUP_FOLDER_ID::"
            - Name: GOOGLE_SA_KEY
              ValueFrom: !Sub "${AppSecret}:GOOGLE_SA_KEY::"
            - Name: GOV_SYNC_DISABLED
              ValueFrom: !Sub "${AppSecret}:GOV_SYNC_DISABLED::"
            - Name: KVITEL_MAILBOX
              ValueFrom: !Sub "${AppSecret}:KVITEL_MAILBOX::"
            - Name: KVITEL_NEDARIM_TOKEN
              ValueFrom: !Sub "${AppSecret}:KVITEL_NEDARIM_TOKEN::"
            - Name: LEGACY_SYNC_DISABLED
              ValueFrom: !Sub "${AppSecret}:LEGACY_SYNC_DISABLED::"
            - Name: LIVE_BALANCES_DISABLED
              ValueFrom: !Sub "${AppSecret}:LIVE_BALANCES_DISABLED::"
            - Name: LIVE_BALANCES_ENABLED
              ValueFrom: !Sub "${AppSecret}:LIVE_BALANCES_ENABLED::"
            - Name: LOANS_PORTAL_SECRET
              ValueFrom: !Sub "${AppSecret}:LOANS_PORTAL_SECRET::"
            - Name: LOANS_REPORT_DISABLED
              ValueFrom: !Sub "${AppSecret}:LOANS_REPORT_DISABLED::"
            - Name: MAIL_DOMAIN
              ValueFrom: !Sub "${AppSecret}:MAIL_DOMAIN::"
            - Name: MATERNITY_CARD_RETRY_DISABLED
              ValueFrom: !Sub "${AppSecret}:MATERNITY_CARD_RETRY_DISABLED::"
            - Name: NEDARIM_API_PASSWORD
              ValueFrom: !Sub "${AppSecret}:NEDARIM_API_PASSWORD::"
            - Name: NEDARIM_CREATE_TXN_URL
              ValueFrom: !Sub "${AppSecret}:NEDARIM_CREATE_TXN_URL::"
            - Name: NEDARIM_GUARD_ALERT_TO
              ValueFrom: !Sub "${AppSecret}:NEDARIM_GUARD_ALERT_TO::"
            - Name: NEDARIM_HISTORY_URL
              ValueFrom: !Sub "${AppSecret}:NEDARIM_HISTORY_URL::"
            - Name: NEDARIM_HOLIDAY_LIMITED_ID
              ValueFrom: !Sub "${AppSecret}:NEDARIM_HOLIDAY_LIMITED_ID::"
            - Name: NEDARIM_MATERNITY_LIMITED_ID
              ValueFrom: !Sub "${AppSecret}:NEDARIM_MATERNITY_LIMITED_ID::"
            - Name: NEDARIM_MOSAD_ID
              ValueFrom: !Sub "${AppSecret}:NEDARIM_MOSAD_ID::"
            - Name: NEDARIM_PROXY_URL
              ValueFrom: !Sub "${AppSecret}:NEDARIM_PROXY_URL::"
            - Name: NEWSLETTER_DISABLED
              ValueFrom: !Sub "${AppSecret}:NEWSLETTER_DISABLED::"
            - Name: NEXTAUTH_SECRET
              ValueFrom: !Sub "${AppSecret}:NEXTAUTH_SECRET::"
            - Name: OTP_NONCE_SECRET
              ValueFrom: !Sub "${AppSecret}:OTP_NONCE_SECRET::"
            - Name: RABBI_FORM_BLANK_URL
              ValueFrom: !Sub "${AppSecret}:RABBI_FORM_BLANK_URL::"
            - Name: RESEND_API_KEY
              ValueFrom: !Sub "${AppSecret}:RESEND_API_KEY::"
            - Name: RESEND_WEBHOOK_SECRET
              ValueFrom: !Sub "${AppSecret}:RESEND_WEBHOOK_SECRET::"
            - Name: RESEND_WEBHOOK_SIGNING_SECRET
              ValueFrom: !Sub "${AppSecret}:RESEND_WEBHOOK_SIGNING_SECRET::"
            - Name: SCHEDULED_MAIL_DISABLED
              ValueFrom: !Sub "${AppSecret}:SCHEDULED_MAIL_DISABLED::"
            - Name: SUPABASE_SERVICE_ROLE_KEY
              ValueFrom: !Sub "${SupaSecret}:service_key::"
            - Name: UNLOAD_EXPIRED_DISABLED
              ValueFrom: !Sub "${AppSecret}:UNLOAD_EXPIRED_DISABLED::"
            - Name: VERIFY_FROM_EMAIL
              ValueFrom: !Sub "${AppSecret}:VERIFY_FROM_EMAIL::"
            - Name: VERIFY_FROM_NAME
              ValueFrom: !Sub "${AppSecret}:VERIFY_FROM_NAME::"
            - Name: VOICE_REBUILD_DISABLED
              ValueFrom: !Sub "${AppSecret}:VOICE_REBUILD_DISABLED::"
            - Name: YEMOT_ANNOUNCE_TEMPLATE_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_ANNOUNCE_TEMPLATE_ID::"
            - Name: YEMOT_API_TOKEN
              ValueFrom: !Sub "${AppSecret}:YEMOT_API_TOKEN::"
            - Name: YEMOT_BOOK_FAIR_AUDIO
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_AUDIO::"
            - Name: YEMOT_BOOK_FAIR_CALLER_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_CALLER_ID::"
            - Name: YEMOT_BOOK_FAIR_CREDIT_TEMPLATE_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_CREDIT_TEMPLATE_ID::"
            - Name: YEMOT_BOOK_FAIR_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_EXT::"
            - Name: YEMOT_BOOK_FAIR_TEXT_ONLY
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_TEXT_ONLY::"
            - Name: YEMOT_BOOK_FAIR_TOKEN
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_TOKEN::"
            - Name: YEMOT_CREDITS_FALLBACK_FOLDER
              ValueFrom: !Sub "${AppSecret}:YEMOT_CREDITS_FALLBACK_FOLDER::"
            - Name: YEMOT_CREDITS_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_CREDITS_SECRET::"
            - Name: YEMOT_FOLDER_HOLIDAY
              ValueFrom: !Sub "${AppSecret}:YEMOT_FOLDER_HOLIDAY::"
            - Name: YEMOT_FOLDER_IVR_FILES
              ValueFrom: !Sub "${AppSecret}:YEMOT_FOLDER_IVR_FILES::"
            - Name: YEMOT_FOLDER_MATERNITY
              ValueFrom: !Sub "${AppSecret}:YEMOT_FOLDER_MATERNITY::"
            - Name: YEMOT_GILYONOT_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_GILYONOT_SECRET::"
            - Name: YEMOT_HOLIDAY_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_HOLIDAY_EXT::"
            - Name: YEMOT_KVITEL_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_KVITEL_SECRET::"
            - Name: YEMOT_MATERNITY_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_MATERNITY_EXT::"
            - Name: YEMOT_MENU_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_MENU_EXT::"
            - Name: YEMOT_OTP_CALLER_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_CALLER_ID::"
            - Name: YEMOT_OTP_DIGIT_SEP
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_DIGIT_SEP::"
            - Name: YEMOT_OTP_TEMPLATE_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_TEMPLATE_ID::"
            - Name: YEMOT_SINGLE_ENDPOINT
              ValueFrom: !Sub "${AppSecret}:YEMOT_SINGLE_ENDPOINT::"
            - Name: YEMOT_TOKEN
              ValueFrom: !Sub "${AppSecret}:YEMOT_TOKEN::"
            - Name: YEMOT_WEBHOOK_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_WEBHOOK_SECRET::"

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress 443 and 80
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks ingress from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSg}

  # --- מסד ואחסון קבצים פרטיים (יעד ההעתקה מ-Supabase) ---
  CopySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Copy job (outbound only, no ingress)
      VpcId: !Ref VpcId
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres from app tasks and copy job only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref TaskSg}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref CopySg}
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} db"
      SubnetIds: !Ref SubnetIds
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  # הסיסמה נוצרת ומנוהלת ע"י RDS ב-Secrets Manager (לא עוברת בצ'אט ולא בתבנית)
  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbStorageGb
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      DBName: app
      MasterUsername: dbadmin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSg]
      BackupRetentionPeriod: 14
      DeletionProtection: true
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-files-${AWS::AccountId}"
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{BucketKeyEnabled: true, ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules: [{Id: old-versions, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 90}}]
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Statement:
          - {Sid: TlsOnly, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt FilesBucket.Arn, !Sub "${FilesBucket.Arn}/*"], Condition: {Bool: {'aws:SecureTransport': 'false'}}}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Tg}]

  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      # עם תעודה: הפניה ל-HTTPS. בלי תעודה (מצב זמני): העברה ישירה לשרת
      DefaultActions:
        - !If
          - HasCert
          - {Type: redirect, RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}}
          - {Type: forward, TargetGroupArn: !Ref Tg}

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpRedirect]
    Properties:
      ServiceName: !Ref ProjectName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDef
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 90
      # תגית Project של הסטאק עוברת גם לשרתים שרצים, כדי שיופיעו בדוח החיוב של הפרויקט
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers: [{ContainerName: app, ContainerPort: 3000, TargetGroupArn: !Ref Tg}]

  # --- רכיבי Supabase עצמאיים (PostgREST, Auth, Storage) מאחורי nginx, על אותו דומיין: /rest/v1 /auth/v1 /storage/v1 ---
  # הסוד מתמלא עם aws/supabase-keys.sh (מפתחות JWT וסיסמאות תפקידי המסד נוצרים שם, לא עוברים בצ'אט)
  SupaSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/supabase-gw"
      SecretString: '{"jwt_secret":"","anon_key":"","service_key":"","authenticator_pw":"","auth_admin_pw":"","storage_admin_pw":"","rest_url":"","auth_url":"","storage_url":""}'
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  SupaLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${ProjectName}-supabase", RetentionInDays: 30}

  SupaSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Supabase gateway from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSg}
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  SupaDbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DbSg, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref SupaSg}

  SupaTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-supabase"
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: nginx:1.27-alpine
          Essential: true
          PortMappings: [{ContainerPort: 8000}]
          EntryPoint: [sh, -c]
          Command:
            - |
              cat > /etc/nginx/conf.d/default.conf <<'CONF'
              server {
                listen 8000;
                client_max_body_size 100m;
                proxy_read_timeout 300s;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $http_x_forwarded_for;
                location = /health { return 200 'ok'; }
                location /rest/v1/ { proxy_pass http://127.0.0.1:3001/; }
                location /auth/v1/ { proxy_pass http://127.0.0.1:9999/; }
                location /storage/v1/ { proxy_pass http://127.0.0.1:5000/; }
              }
              CONF
              exec nginx -g 'daemon off;'
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: gateway}
        - Name: postgrest
          Image: postgrest/postgrest:v13.0.8
          Essential: true
          Environment:
            - {Name: PGRST_DB_SCHEMAS, Value: public}
            - {Name: PGRST_DB_ANON_ROLE, Value: anon}
            - {Name: PGRST_SERVER_PORT, Value: '3001'}
            - {Name: PGRST_DB_POOL, Value: '10'}
          Secrets:
            - {Name: PGRST_DB_URI, ValueFrom: !Sub "${SupaSecret}:rest_url::"}
            - {Name: PGRST_JWT_SECRET, ValueFrom: !Sub "${SupaSecret}:jwt_secret::"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: postgrest}
        - Name: auth
          Image: supabase/auth:v2.197.0
          Essential: true
          Environment:
            - {Name: GOTRUE_API_HOST, Value: 0.0.0.0}
            - {Name: GOTRUE_API_PORT, Value: '9999'}
            - {Name: API_EXTERNAL_URL, Value: !Sub "https://${DomainName}/auth/v1"}
            - {Name: GOTRUE_SITE_URL, Value: !Sub "https://${DomainName}"}
            - {Name: GOTRUE_URI_ALLOW_LIST, Value: !Sub "https://${DomainName}/**"}
            - {Name: GOTRUE_DB_DRIVER, Value: postgres}
            - {Name: GOTRUE_JWT_EXP, Value: '3600'}
            - {Name: GOTRUE_JWT_AUD, Value: authenticated}
            - {Name: GOTRUE_JWT_DEFAULT_GROUP_NAME, Value: authenticated}
            - {Name: GOTRUE_DISABLE_SIGNUP, Value: 'true'}
            - {Name: GOTRUE_MAILER_AUTOCONFIRM, Value: 'false'}
            - {Name: GOTRUE_SMTP_HOST, Value: smtp.resend.com}
            - {Name: GOTRUE_SMTP_PORT, Value: '465'}
            - {Name: GOTRUE_SMTP_USER, Value: resend}
            - {Name: GOTRUE_SMTP_SENDER_NAME, Value: חתם סופר}
          Secrets:
            - {Name: GOTRUE_DB_DATABASE_URL, ValueFrom: !Sub "${SupaSecret}:auth_url::"}
            - {Name: GOTRUE_JWT_SECRET, ValueFrom: !Sub "${SupaSecret}:jwt_secret::"}
            - {Name: GOTRUE_SMTP_PASS, ValueFrom: !Sub "${AppSecret}:RESEND_API_KEY::"}
            - {Name: GOTRUE_SMTP_ADMIN_EMAIL, ValueFrom: !Sub "${AppSecret}:VERIFY_FROM_EMAIL::"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: auth}
        - Name: storage
          Image: supabase/storage-api:v1.88.0
          Essential: true
          Environment:
            - {Name: SERVER_PORT, Value: '5000'}
            - {Name: STORAGE_BACKEND, Value: s3}
            - {Name: STORAGE_S3_BUCKET, Value: !Ref FilesBucket}
            - {Name: STORAGE_S3_REGION, Value: !Ref 'AWS::Region'}
            - {Name: REGION, Value: !Ref 'AWS::Region'}
            - {Name: TENANT_ID, Value: chasamsofer}
            - {Name: IS_MULTITENANT, Value: 'false'}
            - {Name: DB_INSTALL_ROLES, Value: 'false'}
            - {Name: POSTGREST_URL, Value: 'http://127.0.0.1:3001'}
            - {Name: FILE_SIZE_LIMIT, Value: '104857600'}
          Secrets:
            - {Name: DATABASE_URL, ValueFrom: !Sub "${SupaSecret}:storage_url::"}
            - {Name: AUTH_JWT_SECRET, ValueFrom: !Sub "${SupaSecret}:jwt_secret::"}
            - {Name: ANON_KEY, ValueFrom: !Sub "${SupaSecret}:anon_key::"}
            - {Name: SERVICE_KEY, ValueFrom: !Sub "${SupaSecret}:service_key::"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: storage}

  SupaTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: HasCert
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  SupaRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCert
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ['/rest/v1/*', '/auth/v1/*', '/storage/v1/*']}]
      Actions: [{Type: forward, TargetGroupArn: !Ref SupaTg}]

  SupaService:
    Type: AWS::ECS::Service
    Condition: HasCert
    DependsOn: [SupaRule]
    Properties:
      ServiceName: !Sub "${ProjectName}-supabase"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref SupaTaskDef
      DesiredCount: !Ref SupaDesiredCount
      HealthCheckGracePeriodSeconds: 120
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref SupaSg]
      LoadBalancers: [{ContainerName: gateway, ContainerPort: 8000, TargetGroupArn: !Ref SupaTg}]

  # WAF בסיסי. ⚠️ כלל גודל הגוף מוגדר Count: העלאות מסמכים ו-webhooks גדולים מ-8KB.
  Waf:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${ProjectName}-waf"}
      Rules:
        - Name: common
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - {Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common}
        - Name: known-bad-inputs
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs}
        - Name: ip-reputation
          Priority: 4
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation}
        - Name: rate-limit
          Priority: 2
          Action: {Block: {}}
          Statement:
            RateBasedStatement: {Limit: 2000, AggregateKeyType: IP}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate}

  WafAssoc:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt Waf.Arn

  # אזור DNS ב-Route 53, רק במעבר סופי (CreateDnsZone=true). עד שמחליפים את שרתי השמות אצל הרשם הוא לא משפיע על האתר החי
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: MakeZone
    Properties: {Name: !Ref DomainName}

  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeZone
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Alb.DNSName, HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID, EvaluateTargetHealth: true}

  CertValidationRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeCertRecord
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref CertValidationName
      Type: CNAME
      TTL: '300'
      ResourceRecords: [!Ref CertValidationValue]

  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-deployer"
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [MakeOidc, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals: {'token.actions.githubusercontent.com:aud': sts.amazonaws.com}
              StringLike: {'token.actions.githubusercontent.com:sub': !Sub "repo:${GitHubRepo}:ref:refs/heads/main"}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage]
                Resource: !GetAtt Repo.Arn
              - {Effect: Allow, Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition], Resource: '*'}
              - {Effect: Allow, Action: [ecs:UpdateService, ecs:DescribeServices], Resource: !Ref Service}
              - {Effect: Allow, Action: 'iam:PassRole', Resource: [!GetAtt ExecRole.Arn, !GetAtt TaskRole.Arn]}

Outputs:
  AlbDnsName: {Value: !GetAtt Alb.DNSName, Description: "כתובת המאזן. בדיקה לפני המעבר: curl -k -H 'Host: <הדומיין>' https://<הכתובת>/api/health"}
  NameServers: {Condition: MakeZone, Value: !Join [', ', !GetAtt Zone.NameServers], Description: "שרתי השמות להחלפה אצל הרשם (שלב אחרון, אחרי בדיקה)"}
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn, Description: "מדביקים ב-GitHub Secret בשם AWS_DEPLOY_ROLE_ARN"}
  SecretArn: {Value: !Ref AppSecret}
  DbEndpoint: {Value: !GetAtt Db.Endpoint.Address}
  DbSecretArn: {Value: !GetAtt Db.MasterUserSecret.SecretArn, Description: "סיסמת המסד החדש (מנוהלת, לא מודפסת)"}
  SupaSecretArn: {Value: !Ref SupaSecret}
  FilesBucketName: {Value: !Ref FilesBucket}
  CopySgId: {Value: !Ref CopySg}
