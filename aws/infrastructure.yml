            - Name: YEMOT_BOOK_FAIR_CALLER_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_CALLER_ID::"
            - Name: YEMOT_BOOK_FAIR_CREDIT_TEMPLATE_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_CREDIT_TEMPLATE_ID::"
            - Name: YEMOT_BOOK_FAIR_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_EXT::"
            - Name: YEMOT_BOOK_FAIR_TEXT_ONLY
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_TEXT_ONLY::"
            - Name: YEMOT_BOOK_FAIR_TOKEN
              ValueFrom: !Sub "${AppSecret}:YEMOT_BOOK_FAIR_TOKEN::"
            - Name: YEMOT_CREDITS_FALLBACK_FOLDER
              ValueFrom: !Sub "${AppSecret}:YEMOT_CREDITS_FALLBACK_FOLDER::"
            - Name: YEMOT_CREDITS_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_CREDITS_SECRET::"
            - Name: YEMOT_FOLDER_HOLIDAY
              ValueFrom: !Sub "${AppSecret}:YEMOT_FOLDER_HOLIDAY::"
            - Name: YEMOT_FOLDER_IVR_FILES
              ValueFrom: !Sub "${AppSecret}:YEMOT_FOLDER_IVR_FILES::"
            - Name: YEMOT_FOLDER_MATERNITY
              ValueFrom: !Sub "${AppSecret}:YEMOT_FOLDER_MATERNITY::"
            - Name: YEMOT_GILYONOT_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_GILYONOT_SECRET::"
            - Name: YEMOT_HOLIDAY_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_HOLIDAY_EXT::"
            - Name: YEMOT_KVITEL_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_KVITEL_SECRET::"
            - Name: YEMOT_MATERNITY_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_MATERNITY_EXT::"
            - Name: YEMOT_MENU_EXT
              ValueFrom: !Sub "${AppSecret}:YEMOT_MENU_EXT::"
            - Name: YEMOT_OTP_CALLER_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_CALLER_ID::"
            - Name: YEMOT_OTP_DIGIT_SEP
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_DIGIT_SEP::"
            - Name: YEMOT_OTP_TEMPLATE_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_TEMPLATE_ID::"
            - Name: YEMOT_SINGLE_ENDPOINT
              ValueFrom: !Sub "${AppSecret}:YEMOT_SINGLE_ENDPOINT::"
            - Name: YEMOT_TOKEN
              ValueFrom: !Sub "${AppSecret}:YEMOT_TOKEN::"
            - Name: YEMOT_WEBHOOK_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_WEBHOOK_SECRET::"

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - 80 ו-443
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: משימות - קבלת תעבורה מה-ALB בלבד
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSg}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Tg}]

  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      # עם תעודה: הפניה ל-HTTPS. בלי תעודה (בדיקה): מעביר ישר לאפליקציה ב-HTTP
      DefaultActions:
        - !If
          - HasCert
          - Type: redirect
            RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
          - {Type: forward, TargetGroupArn: !Ref Tg}

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpRedirect, HttpsListener]
    Properties:
      ServiceName: chasamsofer
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDef
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 90
      # תגית Project של הסטאק עוברת גם לשרתים שרצים, כדי שיופיעו בדוח החיוב של הפרויקט
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers:
        - {ContainerName: app, ContainerPort: 3000, TargetGroupArn: !Ref Tg}

  # WAF בסיסי. ⚠️ כלל גודל הגוף מוגדר Count: העלאות מסמכים ו-webhooks גדולים מ-8KB.
  Waf:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: chasamsofer-waf}
      Rules:
        - Name: common
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - {Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common}
        - Name: rate-limit
          Priority: 2
          Action: {Block: {}}
          Statement:
            RateBasedStatement: {Limit: 2000, AggregateKeyType: IP}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate}

  WafAssoc:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt Waf.Arn

  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: chasamsofer-deployer
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [MakeOidc, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals: {'token.actions.githubusercontent.com:aud': sts.amazonaws.com}
              StringLike: {'token.actions.githubusercontent.com:sub': !Sub "repo:${GitHubRepo}:ref:refs/heads/main"}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage]
                Resource: !GetAtt Repo.Arn
              - {Effect: Allow, Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition], Resource: '*'}
              - {Effect: Allow, Action: [ecs:UpdateService, ecs:DescribeServices], Resource: !Ref Service}
              - {Effect: Allow, Action: 'iam:PassRole', Resource: [!GetAtt ExecRole.Arn, !GetAtt TaskRole.Arn]}

Outputs:
  AlbDnsName: {Value: !GetAtt Alb.DNSName, Description: "כתובת הבדיקה (http) והיעד ל-DNS של הדומיין (CNAME)"}
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn, Description: "מדביקים ב-GitHub Secret בשם AWS_DEPLOY_ROLE_ARN"}
  SecretArn: {Value: !Ref AppSecret}
