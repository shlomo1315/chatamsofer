AWSTemplateFormatVersion: '2010-09-09'
Description: חתם סופר - תשתית ECS Fargate (ECR, סודות, הרשאת OIDC ל-GitHub, ALB עם WAF, Route 53)

# פריסה: CloudFormation -> Create stack -> העלאת הקובץ הזה. אזור: eu-central-1.
# ⚠️ משימה אחת בלבד (DesiredCount=1): instrumentation.ts מריץ תזמונים פנימיים (גיבוי, פריקה, סנכרונים),
# ושתי משימות היו מריצות אותם פעמיים. כמו ב-Railway.

Parameters:
  ProjectName: {Type: String, Default: chasamsofer, AllowedPattern: "^[a-z][a-z0-9-]{1,30}$", Description: "שם הפרויקט באותיות קטנטנות באנגלית. משמש לשמות כל המשאבים ולתגית Project. לפרויקט נוסף: שם סטאק ושם פרויקט אחרים"}
  GitHubRepo: {Type: String, Default: shlomo1315/chatamsofer, Description: "owner/repo של הפרויקט. ההרשאה לפריסה מוגבלת לענף main שלו בלבד"}
  DomainName: {Type: String, Default: aws.chasamsofer.co.il, Description: "הכתובת שהאתר עונה בה. תת-דומיין זמני (aws.chasamsofer.co.il) או הדומיין הסופי"}
  CreateDnsZone: {Type: String, Default: 'false', AllowedValues: ['true', 'false'], Description: "false = מצב ביניים: ה-DNS נשאר אצל הרשם, בלי אזור Route 53. true = מעבר סופי: נוצר אזור והרשומות בו (ומחליפים שרתי שמות)"}
  CertificateArn: {Type: String, Default: '', AllowedPattern: "^(arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/[a-f0-9-]+)?$", Description: "ARN של תעודת ACM שהונפקה לדומיין. ריק = מצב זמני על HTTP עד שהתעודה מאומתת, ואז מריצים שוב עם ARN"}
  ExtraCertificateArn: {Type: String, Default: '', AllowedPattern: "^(arn:aws:acm:[a-z0-9-]+:[0-9]+:certificate/[a-f0-9-]+)?$", Description: "תעודת ACM נוספת על ה-listener של 443 (למשל aws.chasamsofer.co.il). התעודה הראשית נשארת ברירת המחדל. ריק = בלי תעודה נוספת"}
  CertValidationName: {Type: String, Default: '', Description: "שם רשומת ה-CNAME של אימות התעודה, כדי שהחידוש האוטומטי ימשיך לעבוד גם אחרי החלפת שרתי השמות"}
  CertValidationValue: {Type: String, Default: '', Description: "ערך רשומת האימות"}
  VpcId: {Type: AWS::EC2::VPC::Id, Description: "ה-VPC ברירת המחדל"}
  SubnetIds: {Type: "List<AWS::EC2::Subnet::Id>", Description: "שתי תתי-רשתות ציבוריות בשני אזורי זמינות (המאזן והשרת)"}
  AdminAllowedIps: {Type: CommaDelimitedList, Default: "", Description: "כתובות IPv4 מורשות לניהול מחוץ לישראל, בפורמט 1.2.3.4/32 ומופרדות בפסיק. ריק = ישראל בלבד"}
  CostCapUsd: {Type: Number, Default: 60, Description: "תקרת עלות חודשית בדולרים. בחציית ה-100% נחסמת יצירת משאבים חדשים בתשלום"}
  CostAlertEmail: {Type: String, Default: s0527101315@gmail.com, Description: "מייל להתראות עלות"}
  ProxyAmiId: {Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>", Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64, Description: "תמונת Amazon Linux 2023 (ARM) לשרת הביניים של נדרים"}
  TaskCpu: {Type: String, Default: '512', AllowedValues: ['512', '1024', '2048'], Description: "מעבד לשרת: 512 = חצי ליבה, 1024 = ליבה. משפיע ישירות על העלות"}
  TaskMemory: {Type: String, Default: '1024', AllowedValues: ['1024', '2048', '3072', '4096'], Description: "זיכרון ב-MB. 512 מעבד מאפשר עד 4096, 1024 מאפשר 2048 ומעלה"}
  DbInstanceClass: {Type: String, Default: db.t4g.medium, Description: "גודל מופע המסד"}
  DbStorageGb: {Type: Number, Default: 50, MinValue: 20, Description: "אחסון התחלתי ב-GB (גדל אוטומטית עד 200)"}
  SupaDesiredCount: {Type: Number, Default: 0, Description: "0 עד שהמסד החדש מולא ונוצר הסוד supabase-gw. אז 1"}
  DesiredCount: {Type: Number, Default: 0, Description: "0 בהקמה ראשונה. אחרי שהפריסה הראשונה העלתה image: 1"}
  CreateOidcProvider: {Type: String, Default: 'true', AllowedValues: ['true', 'false'], Description: "false אם כבר קיים provider של GitHub בחשבון"}
  ExistingOidcProviderArn: {Type: String, Default: ''}

Conditions:
  HasAdminIps: !Not [!Equals [!Join ['', !Ref AdminAllowedIps], '']]
  HasCert: !Not [!Equals [!Ref CertificateArn, '']]
  HasExtraCert: !And [!Condition HasCert, !Not [!Equals [!Ref ExtraCertificateArn, '']]]
  HasCertValidation: !Not [!Equals [!Ref CertValidationName, '']]
  MakeZone: !Equals [!Ref CreateDnsZone, 'true']
  MakeCertRecord: !And [!Condition MakeZone, !Condition HasCertValidation]
  MakeOidc: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"untagged-after-1-day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}},{"rulePriority":2,"description":"keep-last-10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  # ⚠️ הערכים ריקים בכוונה: ממלאים אותם ב-Secrets Manager (Retrieve/Edit) ולא כאן. אל תשנו את SecretString בתבנית אחרי המילוי.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/prod"
      SecretString: '{"ANTHROPIC_API_KEY":"","BOOK_FAIR_AUTO_OPEN_DISABLED":"","BOOK_FAIR_CLEANUP_DISABLED":"","CRON_SECRET":"","DAILY_BACKUP_DISABLED":"","DISTRIBUTIONS_PORTAL_SECRET":"","ELEVENLABS_API_KEY":"","ELEVENLABS_MODEL_ID":"","ELEVENLABS_VOICE_ID":"","GILYONOT_DISABLED":"","GILYONOT_FROM_EMAIL":"","GILYONOT_NEDARIM_TOKEN":"","GMAIL_CLIENT_ID":"","GMAIL_CLIENT_SECRET":"","GMAIL_EMAIL":"","GMAIL_PUBSUB_TOPIC":"","GMAIL_PUSH_TOKEN":"","GMAIL_REDIRECT_URI":"","GMAIL_WATCH_RENEW_DISABLED":"","GOOGLE_DRIVE_BACKUP_FOLDER_ID":"","GOOGLE_SA_KEY":"","GOV_SYNC_DISABLED":"","KVITEL_MAILBOX":"","KVITEL_NEDARIM_TOKEN":"","LEGACY_SYNC_DISABLED":"","LIVE_BALANCES_DISABLED":"","LIVE_BALANCES_ENABLED":"","LOANS_PORTAL_SECRET":"","LOANS_REPORT_DISABLED":"","MAIL_DOMAIN":"","MATERNITY_CARD_RETRY_DISABLED":"","NEDARIM_API_PASSWORD":"","NEDARIM_CREATE_TXN_URL":"","NEDARIM_GUARD_ALERT_TO":"","NEDARIM_HISTORY_URL":"","NEDARIM_HOLIDAY_LIMITED_ID":"","NEDARIM_MATERNITY_LIMITED_ID":"","NEDARIM_MOSAD_ID":"","NEDARIM_PROXY_URL":"","NEWSLETTER_DISABLED":"","NEXTAUTH_SECRET":"","OTP_NONCE_SECRET":"","RABBI_FORM_BLANK_URL":"","RESEND_API_KEY":"","RESEND_WEBHOOK_SECRET":"","RESEND_WEBHOOK_SIGNING_SECRET":"","SCHEDULED_MAIL_DISABLED":"","SUPABASE_SERVICE_ROLE_KEY":"","UNLOAD_EXPIRED_DISABLED":"","VERIFY_FROM_EMAIL":"","VERIFY_FROM_NAME":"","VOICE_REBUILD_DISABLED":"","YEMOT_ANNOUNCE_TEMPLATE_ID":"","YEMOT_API_TOKEN":"","YEMOT_BOOK_FAIR_AUDIO":"","YEMOT_BOOK_FAIR_CALLER_ID":"","YEMOT_BOOK_FAIR_CREDIT_TEMPLATE_ID":"","YEMOT_BOOK_FAIR_EXT":"","YEMOT_BOOK_FAIR_TEXT_ONLY":"","YEMOT_BOOK_FAIR_TOKEN":"","YEMOT_CREDITS_FALLBACK_FOLDER":"","YEMOT_CREDITS_SECRET":"","YEMOT_FOLDER_HOLIDAY":"","YEMOT_FOLDER_IVR_FILES":"","YEMOT_FOLDER_MATERNITY":"","YEMOT_GILYONOT_SECRET":"","YEMOT_HOLIDAY_EXT":"","YEMOT_KVITEL_SECRET":"","YEMOT_MATERNITY_EXT":"","YEMOT_MENU_EXT":"","YEMOT_OTP_CALLER_ID":"","YEMOT_OTP_DIGIT_SEP":"","YEMOT_OTP_TEMPLATE_ID":"","YEMOT_SINGLE_ENDPOINT":"","YEMOT_TOKEN":"","YEMOT_WEBHOOK_SECRET":""}'

  # פרטי החיבור לקריאה בלבד מ-Supabase (host/user/password). ממלאים עם aws/fill-src-secret.sh בלי הדפסה
  SrcSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/supabase-src"
      SecretString: '{"host":"","user":"","password":""}'
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${ProjectName}", RetentionInDays: 30}

  Cluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterName: !Ref ProjectName}

  ExecRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: [!Ref AppSecret, !Ref SrcSecret, !Ref SupaSecret, !GetAtt Db.MasterUserSecret.SecretArn]}]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: files-bucket
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject'], Resource: !Sub "${FilesBucket.Arn}/*"}
              - {Effect: Allow, Action: 's3:ListBucket', Resource: !GetAtt FilesBucket.Arn}

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          # image זמני עד הפריסה הראשונה מ-GitHub
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:latest"
          Essential: true
          PortMappings: [{ContainerPort: 3000}]
          Environment:
            - {Name: NEXT_PUBLIC_SITE_URL, Value: !Sub "https://${DomainName}"}
            - {Name: NEXT_PUBLIC_APP_URL, Value: !Sub "https://${DomainName}"}
            - {Name: TZ, Value: Asia/Jerusalem}
            - {Name: NEXT_PUBLIC_SUPABASE_URL, Value: !Sub "https://${DomainName}"}
            # כתובת פנימית (Cloud Map) לקריאות Supabase מצד השרת בלבד, כדי לעקוף DNS ציבורי. הדפדפן נשאר על הכתובת הציבורית
            - {Name: SUPABASE_INTERNAL_URL, Value: !If [HasCert, !Sub "http://supabase.${ProjectName}.internal:8000", '']}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Sub "/ecs/${ProjectName}", awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: app}
          Secrets:
            - Name: ANTHROPIC_API_KEY
              ValueFrom: !Sub "${AppSecret}:ANTHROPIC_API_KEY::"
            - Name: BOOK_FAIR_AUTO_OPEN_DISABLED
              ValueFrom: !Sub "${AppSecret}:BOOK_FAIR_AUTO_OPEN_DISABLED::"
            - Name: BOOK_FAIR_CLEANUP_DISABLED
              ValueFrom: !Sub "${AppSecret}:BOOK_FAIR_CLEANUP_DISABLED::"
            - Name: CRON_SECRET
              ValueFrom: !Sub "${AppSecret}:CRON_SECRET::"
            - Name: DAILY_BACKUP_DISABLED
              ValueFrom: !Sub "${AppSecret}:DAILY_BACKUP_DISABLED::"
            - Name: DISTRIBUTIONS_PORTAL_SECRET
              ValueFrom: !Sub "${AppSecret}:DISTRIBUTIONS_PORTAL_SECRET::"
            - Name: ELEVENLABS_API_KEY
              ValueFrom: !Sub "${AppSecret}:ELEVENLABS_API_KEY::"
            - Name: ELEVENLABS_MODEL_ID
              ValueFrom: !Sub "${AppSecret}:ELEVENLABS_MODEL_ID::"
            - Name: ELEVENLABS_VOICE_ID
              ValueFrom: !Sub "${AppSecret}:ELEVENLABS_VOICE_ID::"
            - Name: GILYONOT_DISABLED
              ValueFrom: !Sub "${AppSecret}:GILYONOT_DISABLED::"
            - Name: GILYONOT_FROM_EMAIL
              ValueFrom: !Sub "${AppSecret}:GILYONOT_FROM_EMAIL::"
            - Name: GILYONOT_NEDARIM_TOKEN
              ValueFrom: !Sub "${AppSecret}:GILYONOT_NEDARIM_TOKEN::"
            - Name: GMAIL_CLIENT_ID
              ValueFrom: !Sub "${AppSecret}:GMAIL_CLIENT_ID::"
            - Name: GMAIL_CLIENT_SECRET
              ValueFrom: !Sub "${AppSecret}:GMAIL_CLIENT_SECRET::"
            - Name: GMAIL_EMAIL
