              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_CALLER_ID::"
            - Name: YEMOT_OTP_DIGIT_SEP
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_DIGIT_SEP::"
            - Name: YEMOT_OTP_TEMPLATE_ID
              ValueFrom: !Sub "${AppSecret}:YEMOT_OTP_TEMPLATE_ID::"
            - Name: YEMOT_SINGLE_ENDPOINT
              ValueFrom: !Sub "${AppSecret}:YEMOT_SINGLE_ENDPOINT::"
            - Name: YEMOT_TOKEN
              ValueFrom: !Sub "${AppSecret}:YEMOT_TOKEN::"
            - Name: YEMOT_WEBHOOK_SECRET
              ValueFrom: !Sub "${AppSecret}:YEMOT_WEBHOOK_SECRET::"

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress 443 and 80
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks ingress from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSg}

  # --- שרת ביניים קטן (squid) עם כתובת קבועה, רק לפניות לנדרים פלוס ---
  # האתר ממשיך לצאת כרגיל. רק הפניות ל-matara.pro עוברות דרך השרת הזה (NEDARIM_PROXY_URL), ולכן רק הכתובת שלו (NedarimProxyIp) מוסיפים בנדרים.
  # הכניסה אליו רק משרתי האתר (קבוצת TaskSg, דרך הכתובת הפרטית) ועם שם משתמש וסיסמה מ-Secrets Manager. היעדים מוגבלים ל-matara.pro.
  NedarimProxySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/nedarim-proxy"
      GenerateSecretString:
        SecretStringTemplate: '{"user":"nedarim"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  NedarimProxySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nedarim proxy, ingress 3128 from site tasks only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3128, ToPort: 3128, SourceSecurityGroupId: !Ref TaskSg}
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  NedarimProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: read-proxy-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref NedarimProxySecret}]
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  NedarimProxyProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref NedarimProxyRole]}

  NedarimProxyLt:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ProxyAmiId
        InstanceType: t4g.nano
        IamInstanceProfile: {Arn: !GetAtt NedarimProxyProfile.Arn}
        MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2}
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            # 512MB זיכרון לא מספיקים להתקנת squid (dnf נהרג), לכן קודם swap של 1GB
            if ! swapon --show | grep -q swapfile; then
              [ -f /swapfile ] || { fallocate -l 1G /swapfile; chmod 600 /swapfile; mkswap /swapfile; }
              swapon /swapfile
            fi
            dnf install -y squid httpd-tools
            S=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${NedarimProxySecret} --query SecretString --output text)
            U=$(echo "$S" | sed -n 's/.*"user":"\([^"]*\)".*/\1/p'); P=$(echo "$S" | sed -n 's/.*"password":"\([^"]*\)".*/\1/p')
            htpasswd -bc /etc/squid/passwd "$U" "$P"; chown root:squid /etc/squid/passwd; chmod 640 /etc/squid/passwd
            cat > /etc/squid/squid.conf <<'CONF'
            http_port 3128
            auth_param basic program /usr/lib64/squid/basic_ncsa_auth /etc/squid/passwd
            auth_param basic realm nedarim-proxy
            acl authed proxy_auth REQUIRED
            acl dests dstdomain .matara.pro checkip.amazonaws.com
            acl SSL_ports port 443
            acl Safe_ports port 80 443
            acl CONNECT method CONNECT
            http_access deny !Safe_ports
            http_access deny CONNECT !SSL_ports
            http_access allow authed dests
            http_access deny all
            cache deny all
            forwarded_for delete
            via off
            CONF
            printf "#!/bin/bash\ncurl -s -m 20 -x http://%s:%s@127.0.0.1:3128 https://checkip.amazonaws.com\n" "$U" "$P" > /usr/local/bin/proxy-check; chmod 700 /usr/local/bin/proxy-check
            systemctl enable --now squid

  NedarimProxy:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate: {LaunchTemplateId: !Ref NedarimProxyLt, Version: !GetAtt NedarimProxyLt.LatestVersionNumber}
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref NedarimProxySg]
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-nedarim-proxy"}, {Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  NedarimProxyEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref NedarimProxy
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-nedarim-proxy"}, {Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  # --- מסד ואחסון קבצים פרטיים (יעד ההעתקה מ-Supabase) ---
  CopySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Copy job (outbound only, no ingress)
      VpcId: !Ref VpcId
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres from app tasks and copy job only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref TaskSg}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref CopySg}
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} db"
      SubnetIds: !Ref SubnetIds
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  # הסיסמה נוצרת ומנוהלת ע"י RDS ב-Secrets Manager (לא עוברת בצ'אט ולא בתבנית)
  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbStorageGb
      MaxAllocatedStorage: 200
      StorageType: gp3
      StorageEncrypted: true
      DBName: app
      MasterUsername: dbadmin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSg]
      BackupRetentionPeriod: 14
      DeletionProtection: true
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-files-${AWS::AccountId}"
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{BucketKeyEnabled: true, ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules: [{Id: old-versions, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 90}}]
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Statement:
          - {Sid: TlsOnly, Effect: Deny, Principal: '*', Action: 's3:*', Resource: [!GetAtt FilesBucket.Arn, !Sub "${FilesBucket.Arn}/*"], Condition: {Bool: {'aws:SecureTransport': 'false'}}}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Tg}]

  ExtraListenerCertificate:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Condition: HasExtraCert
    Properties:
      ListenerArn: !Ref HttpsListener
      Certificates: [{CertificateArn: !Ref ExtraCertificateArn}]

  HttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      # עם תעודה: הפניה ל-HTTPS. בלי תעודה (מצב זמני): העברה ישירה לשרת
      DefaultActions:
        - !If
          - HasCert
          - {Type: redirect, RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}}
          - {Type: forward, TargetGroupArn: !Ref Tg}

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpRedirect]
    Properties:
      ServiceName: !Ref ProjectName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDef
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 90
      # תגית Project של הסטאק עוברת גם לשרתים שרצים, כדי שיופיעו בדוח החיוב של הפרויקט
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers: [{ContainerName: app, ContainerPort: 3000, TargetGroupArn: !Ref Tg}]

  # --- רכיבי Supabase עצמאיים (PostgREST, Auth, Storage) מאחורי nginx, על אותו דומיין: /rest/v1 /auth/v1 /storage/v1 ---
  # הסוד מתמלא עם aws/supabase-keys.sh (מפתחות JWT וסיסמאות תפקידי המסד נוצרים שם, לא עוברים בצ'אט)
  # השדה rds_ca (תעודת ה-CA של RDS ל-Storage) נוסף בסקריפט. לא משנים כאן את SecretString: שינוי ידרוס את הסוד הקיים
  SupaSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/supabase-gw"
      SecretString: '{"jwt_secret":"","anon_key":"","service_key":"","authenticator_pw":"","auth_admin_pw":"","storage_admin_pw":"","rest_url":"","auth_url":"","storage_url":""}'
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  SupaLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${ProjectName}-supabase", RetentionInDays: 30}

  SupaSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Supabase gateway from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSg}
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  SupaFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCert
    Properties: {GroupId: !Ref SupaSg, IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref TaskSg, Description: "קריאות Supabase פנימיות משרת האפליקציה"}

  InternalNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: HasCert
    Properties:
      Name: !Sub "${ProjectName}.internal"
      Vpc: !Ref VpcId

  SupaDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Condition: HasCert
    Properties:
      Name: supabase
      NamespaceId: !GetAtt InternalNamespace.Id
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords: [{Type: A, TTL: 10}]

  SupaDbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DbSg, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref SupaSg}

  SupaTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-supabase"
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: nginx:1.27-alpine
          Essential: true
          PortMappings: [{ContainerPort: 8000}]
          EntryPoint: [sh, -c]
          Command:
            - |
              cat > /etc/nginx/conf.d/default.conf <<'CONF'
              server {
                listen 8000;
                client_max_body_size 100m;
                proxy_read_timeout 300s;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-For $http_x_forwarded_for;
                location = /health { return 200 'ok'; }
                location /rest/v1/ { proxy_pass http://127.0.0.1:3001/; }
                location /auth/v1/ { proxy_pass http://127.0.0.1:9999/; }
                location /storage/v1/ { proxy_pass http://127.0.0.1:5000/; }
              }
              CONF
              exec nginx -g 'daemon off;'
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: gateway}
        - Name: postgrest
          Image: postgrest/postgrest:v13.0.8
          Essential: true
          Environment:
            - {Name: PGRST_DB_SCHEMAS, Value: public}
            - {Name: PGRST_DB_ANON_ROLE, Value: anon}
            - {Name: PGRST_SERVER_PORT, Value: '3001'}
            - {Name: PGRST_DB_POOL, Value: '10'}
          Secrets:
            - {Name: PGRST_DB_URI, ValueFrom: !Sub "${SupaSecret}:rest_url::"}
            - {Name: PGRST_JWT_SECRET, ValueFrom: !Sub "${SupaSecret}:jwt_secret::"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: postgrest}
        - Name: auth
          Image: supabase/auth:v2.197.0
          Essential: true
          Environment:
            - {Name: GOTRUE_API_HOST, Value: 0.0.0.0}
            - {Name: GOTRUE_API_PORT, Value: '9999'}
            - {Name: API_EXTERNAL_URL, Value: !Sub "https://${DomainName}/auth/v1"}
            - {Name: GOTRUE_SITE_URL, Value: !Sub "https://${DomainName}"}
            - {Name: GOTRUE_URI_ALLOW_LIST, Value: !Sub "https://${DomainName}/**"}
            - {Name: GOTRUE_DB_DRIVER, Value: postgres}
            - {Name: GOTRUE_JWT_EXP, Value: '3600'}
            - {Name: GOTRUE_JWT_AUD, Value: authenticated}
            - {Name: GOTRUE_JWT_DEFAULT_GROUP_NAME, Value: authenticated}
            - {Name: GOTRUE_DISABLE_SIGNUP, Value: 'true'}
            - {Name: GOTRUE_MAILER_AUTOCONFIRM, Value: 'false'}
            - {Name: GOTRUE_SMTP_HOST, Value: smtp.resend.com}
            - {Name: GOTRUE_SMTP_PORT, Value: '465'}
            - {Name: GOTRUE_SMTP_USER, Value: resend}
            - {Name: GOTRUE_SMTP_SENDER_NAME, Value: חתם סופר}
            # כניסה עם Google: Client ID ו-Secret ב-supabase-gw (aws/google-login.sh). ב-Google Cloud חובה להוסיף את ה-Redirect URI הזה
            - {Name: GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI, Value: !Sub "https://${DomainName}/auth/v1/callback"}
          Secrets:
            - {Name: GOTRUE_DB_DATABASE_URL, ValueFrom: !Sub "${SupaSecret}:auth_url::"}
            - {Name: GOTRUE_JWT_SECRET, ValueFrom: !Sub "${SupaSecret}:jwt_secret::"}
            - {Name: GOTRUE_SMTP_PASS, ValueFrom: !Sub "${AppSecret}:RESEND_API_KEY::"}
            - {Name: GOTRUE_SMTP_ADMIN_EMAIL, ValueFrom: !Sub "${AppSecret}:VERIFY_FROM_EMAIL::"}
            - {Name: GOTRUE_EXTERNAL_GOOGLE_ENABLED, ValueFrom: !Sub "${SupaSecret}:google_enabled::"}
            - {Name: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID, ValueFrom: !Sub "${SupaSecret}:google_client_id::"}
            - {Name: GOTRUE_EXTERNAL_GOOGLE_SECRET, ValueFrom: !Sub "${SupaSecret}:google_secret::"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: auth}
        - Name: storage
          Image: supabase/storage-api:v1.88.0
          # תעודת ה-CA של RDS נטענת לתהליך (NODE_EXTRA_CA_CERTS) כדי שכל החיבורים, כולל המיגרציות, יוצפנו ויאומתו במלואם
          EntryPoint: [sh, -c]
          Command: ['printf "%s" "$DATABASE_SSL_ROOT_CERT" > /tmp/rds-ca.pem; export NODE_EXTRA_CA_CERTS=/tmp/rds-ca.pem; exec docker-entrypoint.sh node dist/start/server.js']
          Essential: true
          Environment:
            - {Name: SERVER_PORT, Value: '5000'}
            - {Name: STORAGE_BACKEND, Value: s3}
            - {Name: STORAGE_S3_BUCKET, Value: !Ref FilesBucket}
            - {Name: STORAGE_S3_REGION, Value: !Ref 'AWS::Region'}
            - {Name: REGION, Value: !Ref 'AWS::Region'}
            - {Name: TENANT_ID, Value: chasamsofer}
            - {Name: IS_MULTITENANT, Value: 'false'}
            - {Name: DB_INSTALL_ROLES, Value: 'false'}
            - {Name: POSTGREST_URL, Value: 'http://127.0.0.1:3001'}
            - {Name: FILE_SIZE_LIMIT, Value: '104857600'}
          Secrets:
            - {Name: DATABASE_URL, ValueFrom: !Sub "${SupaSecret}:storage_url::"}
            - {Name: DATABASE_SSL_ROOT_CERT, ValueFrom: !Sub "${SupaSecret}:rds_ca::"}
            - {Name: AUTH_JWT_SECRET, ValueFrom: !Sub "${SupaSecret}:jwt_secret::"}
            - {Name: ANON_KEY, ValueFrom: !Sub "${SupaSecret}:anon_key::"}
            - {Name: SERVICE_KEY, ValueFrom: !Sub "${SupaSecret}:service_key::"}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref SupaLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: storage}

  SupaTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: HasCert
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}

  SupaRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCert
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions: [{Field: path-pattern, Values: ['/rest/v1/*', '/auth/v1/*', '/storage/v1/*']}]
      Actions: [{Type: forward, TargetGroupArn: !Ref SupaTg}]

  SupaService:
    Type: AWS::ECS::Service
    Condition: HasCert
    DependsOn: [SupaRule]
    Properties:
      ServiceName: !Sub "${ProjectName}-supabase"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref SupaTaskDef
      DesiredCount: !Ref SupaDesiredCount
      HealthCheckGracePeriodSeconds: 120
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref SupaSg]
      LoadBalancers: [{ContainerName: gateway, ContainerPort: 8000, TargetGroupArn: !Ref SupaTg}]
      ServiceRegistries: [{RegistryArn: !GetAtt SupaDiscovery.Arn}]

  # כתובות מורשות לניהול מחוץ לישראל (למשל בנסיעה). ריק = ישראל בלבד. מעדכנים עם aws/admin-geo.sh
  AdminAllowedIpSet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !If [HasAdminIps, !Ref AdminAllowedIps, []]
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  # WAF בסיסי. ⚠️ כלל גודל הגוף מוגדר Count: העלאות מסמכים ו-webhooks גדולים מ-8KB.
  Waf:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: !Sub "${ProjectName}-waf"}
      Rules:
        # מערכת הניהול רק מישראל: /admin, /yerid-admin ו-/api/admin נחסמים לכל מי שלא מגיע מכתובת ישראלית או מכתובת ברשימה AdminAllowedIps.
        # כל נתיבי /api/admin דורשים סשן של צוות ואין בהם קריאות משירותים חיצוניים. webhooks, נדרים, ימות, cron, Google ו-Supabase (/auth/v1) לא בנתיבים האלה ולא מושפעים
        - Name: admin-israel-only
          Priority: 0
          Action: {Block: {}}
          Statement:
            AndStatement:
              Statements:
                - OrStatement:
                    Statements:
                      - ByteMatchStatement: {SearchString: /admin, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: URL_DECODE}, {Priority: 1, Type: LOWERCASE}]}
                      - ByteMatchStatement: {SearchString: /yerid-admin, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: URL_DECODE}, {Priority: 1, Type: LOWERCASE}]}
                      - ByteMatchStatement: {SearchString: /api/admin, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: URL_DECODE}, {Priority: 1, Type: LOWERCASE}]}
                      - ByteMatchStatement: {SearchString: /yerid101315, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: URL_DECODE}, {Priority: 1, Type: LOWERCASE}]}
                - NotStatement:
                    Statement:
                      GeoMatchStatement: {CountryCodes: [IL]}
                - NotStatement:
                    Statement:
                      IPSetReferenceStatement: {Arn: !GetAtt AdminAllowedIpSet.Arn}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: admin-geo}
        # הגבלת קצב נמוכה על הכניסה וקודי האימות (בנוסף להגבלה שבקוד): 100 בקשות ל-5 דקות לכל כתובת
        - Name: login-rate-limit
          Priority: 5
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement: {SearchString: /login, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: LOWERCASE}]}
                    - ByteMatchStatement: {SearchString: /api/send-otp, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: LOWERCASE}]}
                    - ByteMatchStatement: {SearchString: /api/verify-otp, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: LOWERCASE}]}
                    - ByteMatchStatement: {SearchString: /auth/v1/otp, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: LOWERCASE}]}
                    - ByteMatchStatement: {SearchString: /auth/v1/verify, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: LOWERCASE}]}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: login-rate}
        - Name: common
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                - {Name: SizeRestrictions_BODY, ActionToUse: {Count: {}}}
              # העלאות קבצים ל-Storage (POST/PUT/PATCH ל-/storage/v1/object/): תוכן הקובץ נקרא כטקסט ונחסם ב-CrossSiteScripting_BODY. שאר הבקשות נבדקות כרגיל
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    AndStatement:
                      Statements:
                        - ByteMatchStatement:
                            SearchString: /storage/v1/object/
                            FieldToMatch: {UriPath: {}}
                            PositionalConstraint: STARTS_WITH
                            TextTransformations: [{Priority: 0, Type: NONE}]
                        - OrStatement:
                            Statements:
                              - ByteMatchStatement: {SearchString: POST, FieldToMatch: {Method: {}}, PositionalConstraint: EXACTLY, TextTransformations: [{Priority: 0, Type: NONE}]}
                              - ByteMatchStatement: {SearchString: PUT, FieldToMatch: {Method: {}}, PositionalConstraint: EXACTLY, TextTransformations: [{Priority: 0, Type: NONE}]}
                              - ByteMatchStatement: {SearchString: PATCH, FieldToMatch: {Method: {}}, PositionalConstraint: EXACTLY, TextTransformations: [{Priority: 0, Type: NONE}]}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common}
        - Name: known-bad-inputs
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: bad-inputs}
        - Name: ip-reputation
          Priority: 4
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-reputation}
        - Name: rate-limit
          Priority: 2
          Action: {Block: {}}
          # העלאות ל-Storage (מחייבות מפתח) לא נספרות: copy-files מעלה עשרות אלפי קבצים מ-IP אחד, וההגבלה חסמה אותו ב-403
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
              ScopeDownStatement:
                NotStatement:
                  Statement:
                    AndStatement:
                      Statements:
                        - ByteMatchStatement: {SearchString: /storage/v1/object/, FieldToMatch: {UriPath: {}}, PositionalConstraint: STARTS_WITH, TextTransformations: [{Priority: 0, Type: NONE}]}
                        - ByteMatchStatement: {SearchString: POST, FieldToMatch: {Method: {}}, PositionalConstraint: EXACTLY, TextTransformations: [{Priority: 0, Type: NONE}]}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: rate}

  WafAssoc:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref Alb
      WebACLArn: !GetAtt Waf.Arn

  # אזור DNS ב-Route 53, רק במעבר סופי (CreateDnsZone=true). עד שמחליפים את שרתי השמות אצל הרשם הוא לא משפיע על האתר החי
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: MakeZone
    Properties: {Name: !Ref DomainName}

  SiteRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeZone
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Alb.DNSName, HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID, EvaluateTargetHealth: true}

  CertValidationRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeCertRecord
    Properties:
      HostedZoneId: !Ref Zone
      Name: !Ref CertValidationName
      Type: CNAME
      TTL: '300'
      ResourceRecords: [!Ref CertValidationValue]

  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-deployer"
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [MakeOidc, !Ref GitHubOidc, !Ref ExistingOidcProviderArn]
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals: {'token.actions.githubusercontent.com:aud': sts.amazonaws.com}
              StringLike: {'token.actions.githubusercontent.com:sub': !Sub "repo:${GitHubRepo}:ref:refs/heads/main"}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage]
                Resource: !GetAtt Repo.Arn
              - {Effect: Allow, Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition], Resource: '*'}
              - {Effect: Allow, Action: [ecs:UpdateService, ecs:DescribeServices], Resource: !Ref Service}
              - {Effect: Allow, Action: 'iam:PassRole', Resource: [!GetAtt ExecRole.Arn, !GetAtt TaskRole.Arn]}

  # --- תקרת עלות: בחציית ה-100% של התקציב החודשי מוצמדת מדיניות שחוסמת יצירת משאבים חדשים בתשלום ---
  # לא מכבה שום דבר שרץ, לא מוחקת ולא חוסמת עדכון שירותים, תמונות, סודות או כתיבה ל-S3. מוצמדת למשתמש kav-terraform ולתפקיד הפריסה.
  CostCapPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: חסימת יצירת משאבים בתשלום אחרי חציית תקרת העלות
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Action:
              - ec2:RunInstances
              - ec2:CreateNatGateway
              - ec2:AllocateAddress
              - ec2:CreateVolume
              - rds:CreateDBInstance
              - rds:CreateDBCluster
              - rds:CreateDBInstanceReadReplica
              - rds:ModifyDBInstance
              - elasticloadbalancing:CreateLoadBalancer
              - elasticache:Create*
              - es:CreateDomain
              - redshift:CreateCluster
            Resource: '*'

  CostCapBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-cost-cap"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref CostCapUsd, Unit: USD}

  CostCapActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: budgets.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: attach-cap-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [iam:AttachUserPolicy, iam:DetachUserPolicy, iam:AttachRolePolicy, iam:DetachRolePolicy]
                Resource: '*'
                Condition: {ArnEquals: {'iam:PolicyARN': !Ref CostCapPolicy}}
      Tags: [{Key: Project, Value: !Ref ProjectName}, {Key: Owner, Value: shlomo}]

  CostCapAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: !Ref CostCapBudget
      ActionType: APPLY_IAM_POLICY
      NotificationType: ACTUAL
      ApprovalModel: AUTOMATIC
      ActionThreshold: {Type: PERCENTAGE, Value: 100}
      ExecutionRoleArn: !GetAtt CostCapActionRole.Arn
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref CostCapPolicy
          Users: [kav-terraform]
          Roles: [!Ref DeployRole]
      Subscribers: [{Type: EMAIL, Address: !Ref CostAlertEmail}]

Outputs:
  AlbDnsName: {Value: !GetAtt Alb.DNSName, Description: "כתובת המאזן. בדיקה לפני המעבר: curl -k -H 'Host: <הדומיין>' https://<הכתובת>/api/health"}
  NameServers: {Condition: MakeZone, Value: !Join [', ', !GetAtt Zone.NameServers], Description: "שרתי השמות להחלפה אצל הרשם (שלב אחרון, אחרי בדיקה)"}
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn, Description: "מדביקים ב-GitHub Secret בשם AWS_DEPLOY_ROLE_ARN"}
  SecretArn: {Value: !Ref AppSecret}
  DbEndpoint: {Value: !GetAtt Db.Endpoint.Address}
  DbSecretArn: {Value: !GetAtt Db.MasterUserSecret.SecretArn, Description: "סיסמת המסד החדש (מנוהלת, לא מודפסת)"}
  SupaSecretArn: {Value: !Ref SupaSecret}
  FilesBucketName: {Value: !Ref FilesBucket}
  CopySgId: {Value: !Ref CopySg}
  NedarimProxyIp: {Value: !Ref NedarimProxyEip, Description: "הכתובת הקבועה לנדרים פלוס (עוד > מפתחות API)"}
  NedarimProxyPrivateIp: {Value: !GetAtt NedarimProxy.PrivateIp}
  NedarimProxySecretArn: {Value: !Ref NedarimProxySecret}
  NedarimProxyId: {Value: !Ref NedarimProxy}
