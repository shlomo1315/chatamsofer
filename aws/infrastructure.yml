            - Name: OTP_NONCE_SECRET
              ValueFrom: !Sub "${AppSecret}:OTP_NONCE_SECRET::"
            - Name: RABBI_FORM_BLANK_URL
              ValueFrom: !Sub "${AppSecret}:RABBI_FORM_BLANK_URL::"
            - Name: RESEND_API_KEY
              ValueFrom: !Sub "${AppSecret}:RESEND_API_KEY::"
            - Name: RESEND_WEBHOOK_SECRET
              ValueFrom: !Sub "${AppSecret}:RESEND_WEBHOOK_SECRET::"
            - Name: RESEND_WEBHOOK_SIGNING_SECRET
