AWSTemplateFormatVersion: '2010-09-09'
Description: "שמירה על החשבון: יומן פעולות (CloudTrail), זיהוי פריצות (GuardDuty), איתור גישה חיצונית (Access Analyzer) והתראות במייל. מריצים באזור של הפרויקטים (eu-central-1)."

Parameters:
  AlertEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: "המייל שמקבל התראות אבטחה (צריך לאשר את המנוי במייל הראשון מ-AWS Notifications)"
  EnableGuardDuty:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "false אם כבר יש GuardDuty פעיל באזור הזה. עלות: 30 יום חינם, אחר כך בערך 1-5 דולר בחודש בחשבון קטן"
  EnableAccessAnalyzer:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "false אם כבר קיים analyzer מסוג ACCOUNT באזור הזה (חינם)"
  TrailRetentionDays:
    Type: Number
    Default: 365
    MinValue: 90
    Description: "כמה ימים לשמור את יומן הפעולות ב-S3"

Conditions:
  MakeGuardDuty: !Equals [!Ref EnableGuardDuty, 'true']
  MakeAnalyzer: !Equals [!Ref EnableAccessAnalyzer, 'true']

Resources:
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: account-security-alerts
      Subscription: [{Protocol: email, Endpoint: !Ref AlertEmail}]

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EventBridgePublish
            Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition: {StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}}

  # יומן כל הפעולות בחשבון בכל האזורים. ההעתק הראשון של אירועי ניהול חינם; משלמים רק על אחסון קטן ב-S3.
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      LifecycleConfiguration:
        Rules: [{Id: expire-old-logs, Status: Enabled, ExpirationInDays: !Ref TrailRetentionDays}]

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition: {StringEquals: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/account-trail'}}
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition: {StringEquals: {'aws:SourceArn': !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/account-trail'}}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt TrailBucket.Arn, !Sub '${TrailBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: account-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  # מזהה גניבת מפתחות, כריית מטבעות על חשבונך וגישה חשודה: בדיוק מה שמנפח חשבונית
  Detector:
    Type: AWS::GuardDuty::Detector
    Condition: MakeGuardDuty
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES

  GuardDutyAlerts:
    Type: AWS::Events::Rule
    Condition: MakeGuardDuty
    Properties:
      Description: "ממצאי GuardDuty בחומרה בינונית ומעלה למייל"
      EventPattern:
        source: [aws.guardduty]
        detail-type: [GuardDuty Finding]
        detail: {severity: [{numeric: ['>=', 4]}]}
      Targets: [{Id: email, Arn: !Ref AlertsTopic}]

  # מתריע כשמשאב (S3, תפקיד IAM, סוד) נפתח לגישה מחוץ לחשבון
  Analyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Condition: MakeAnalyzer
    Properties:
      AnalyzerName: account-analyzer
      Type: ACCOUNT

  AccessAnalyzerAlerts:
    Type: AWS::Events::Rule
    Condition: MakeAnalyzer
    Properties:
      Description: "גישה חיצונית חדשה למשאב בחשבון"
      EventPattern:
        source: [aws.access-analyzer]
        detail-type: [Access Analyzer Finding]
        detail: {status: [ACTIVE]}
      Targets: [{Id: email, Arn: !Ref AlertsTopic}]

Outputs:
  AlertsTopicArn: {Value: !Ref AlertsTopic}
  TrailBucketName: {Value: !Ref TrailBucket}
