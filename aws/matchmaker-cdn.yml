AWSTemplateFormatVersion: '2010-09-09'
Description: כתובת זמנית ב-HTTPS (CloudFront) לפורטל מלגות השדכנים, עד שיירשם דומיין קבוע
Parameters:
  OriginDomain: {Type: String, Default: chasamsofer.co.il, Description: "הדומיין שמאחוריו ה-ALB עם תעודה תקינה. CloudFront פונה אליו ב-HTTPS"}
Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - {Key: project, Value: chasamsofer}
        - {Key: owner, Value: shlomo}
      DistributionConfig:
        Enabled: true
        Comment: chasamsofer matchmakers portal (temporary host)
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !Ref OriginDomain
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          # בלי מטמון, ומעבירים את כל הכותרות כולל Host, כי הבידוד באפליקציה לפי Host
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
Outputs:
  DomainName: {Value: !GetAtt Distribution.DomainName}
