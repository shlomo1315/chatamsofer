name: בדיקות (Pull Request)

# רץ על כל Pull Request ל-main: אותן בדיקות שחוסמות את הפריסה,
# כדי לראות תקלה *לפני* המיזוג ולא אחריו.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: בדיקת טיפוסים
        run: npx tsc --noEmit
      - name: בדיקות אוטומטיות
        run: npx vitest run
      # lint מדווח בלבד (לא חוסם) עד שינוקו 185 השגיאות הקיימות
      - name: lint (מדווח בלבד)
        run: npx eslint . || true
